name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # required to create a Release on a tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # windows-latest ships Visual Studio 2022 with the C++ workload and
      # vswhere.exe, which is exactly what build.bat looks for.
      - name: Build
        shell: cmd
        run: build.bat

      # The project's central promise is that the exe has no runtime
      # dependency. Losing /MT would silently break "download and run", so it
      # is checked rather than assumed. dumpbin is not on PATH here, hence the
      # import-table string scan: linked DLL names appear verbatim in the PE.
      - name: Verify no CRT dependency
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('build\screenshot_tool.exe')
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $bad = @()
          foreach ($n in 'VCRUNTIME140', 'MSVCP140', 'ucrtbase') {
            if ($ascii.Contains($n)) { $bad += $n }
          }
          if ($bad.Count -gt 0) {
            Write-Error "exe links $($bad -join ', ') — /MT has been lost"
            exit 1
          }
          Write-Host "OK: no CRT DLL in the import table"

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item 'build\screenshot_tool.exe'
          Write-Host ("exe size: {0} bytes ({1} KB)" -f $f.Length, [int]($f.Length / 1KB))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_tool-x64
          path: build/screenshot_tool.exe
          if-no-files-found: error

      # A push to a v* tag publishes a Release with the exe attached, which is
      # what the README's download link points at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "build/screenshot_tool.exe" `
            --title "${{ github.ref_name }}" `
            --generate-notes
